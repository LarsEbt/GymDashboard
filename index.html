<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gym Dashboard</title>
        <link rel="stylesheet" href="css/styles.css">
        <!--- Material Icons --->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

       
    </head>
    <body>
        <div class="grid-container">
            <header class="header">
                	<div class="logo">
                        Lars Tracking Dashboard
                    </div>

                    <div class="header-left">
                        <ul class="list">
                            <li class="list-item">
                                <a href="#"> 
                                    <span class="material-icons-outlined">
                                    dashboard
                                    </span> DASHBOARD</a>
                            </li>
                            <li class="list-item">
                                <a href="#"> 
                                    <span class="material-icons-outlined">
                                    inventory_2
                                    </span> PRODUCTS</a>
                            </li>
                            <li class="list-item">
                                <a href="#"> 
                                    <span class="material-icons-outlined">
                                    poll
                                    </span> REPORTS</a>
                            </li>
                            <li class="list-item">
                                <a href="#"> 
                                    <span class="material-icons-outlined">
                                    settings
                                    </span> SETTINGS</a>
                            </li>
                        </ul>
                    </div>

                    <div class="header-right">
                        <span class="material-icons-outlined">notifications</span>
                        <span class="material-icons-outlined">email</span>
                        <span class="material-icons-outlined">account_circle</span>
                    </div>
            </header>


            <main class="main-container">
                <div class="main-cards">
                    <div class="card">
                        <div class="card-inner">
                            <p>TIME</p>
                            <div class="icon icon-shape background-blue text-primary">
                                <span class="material-symbols-outlined">
                                    avg_time
                                    </span>
                            </div>
                        </div> 
                        <span class="text-primary">249</span>
                    </div>
                    
                    <div class="card">
                        <div class="card-inner">
                            <p>ACTIVITY</p>
                            <div class="icon icon-shape background-orange text-primary">
                                <span class="material-symbols-outlined">
                                    exercise
                                    </span>
                            </div>
                        </div>
                        <span class="text-primary">83</span>
                    </div>

                    <div class="card">
                        <div class="card-inner">
                            <p>TOTAL ACTIVITIES</p>
                            <div class="icon icon-shape background-green text-primary">
                                <span class="material-symbols-outlined">
                                    history
                                    </span>
                            </div>
                        </div>
                        <span class="text-primary">66</span>
                    </div>
                
                    <div class="card">
                        <div class="card-inner">
                            <p>TOTAL TIME</p>
                            <div class="icon icon-shape background-red text-primary">
                                <span class="material-symbols-outlined">
                                    timer
                                    </span>
                            </div>
                        </div>
                        <span class="text-primary">84</span>
                    </div>
                </div>
                    <div class="charts">
                        <div class="charts-card">
                            <p class="chart-title">Mounth Overview Chart</p>
                                <div id="bar-chart"></div>
                        </div>
                    </div>

                    <div class="charts">
                        <div class="charts-card">
                            <p class="chart-title">Time Overview Chart</p>
                                <div id="area-chart"></div>
                        </div>
                    </div>


            </main>


        </div>
        <!-- scripts js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/4.3.0/apexcharts.min.js"></script>
        <script src="js/scripts.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    </body>
</html>
